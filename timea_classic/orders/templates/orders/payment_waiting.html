{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{% static 'core/images/favicon.ico' %}">
    <title>Waiting for Payment - Timea Classic</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .payment-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .mpesa-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #e8f5e9;
            color: #2e7d32;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        /* Animated Spinner & Pulse Ring */
        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: rgba(46, 125, 50, 0.15);
            animation: pulse 2s infinite ease-in-out;
        }

        .spinner {
            width: 54px;
            height: 54px;
            border: 4px solid #e0e0e0;
            border-top-color: #2e7d32;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 1;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(0.85); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0.3; }
            100% { transform: scale(0.85); opacity: 0.8; }
        }

        .title {
            font-size: 1.35rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .description {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .status-box {
            background-color: #f8f9fa;
            border: 1px dashed #cccccc;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.88rem;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-status {
            background-color: #1976d2;
            color: #ffffff;
            cursor: default;
        }

        .btn-cart {
            background-color: #f5f5f5;
            color: #444;
            border: 1px solid #e0e0e0;
        }

        .btn-cart:hover {
            background-color: #eeeeee;
            color: #111;
        }
    </style>
</head>
<body>

    <div class="payment-card">
        <div class="mpesa-badge">
            <i class="fa-solid fa-mobile-screen-button"></i> M-Pesa STK Push Sent
        </div>

        <div class="spinner-container">
            <div class="pulse-ring"></div>
            <div class="spinner"></div>
        </div>

        <h2 class="title">Waiting for Payment</h2>
        
        <p class="description">
            Check your phone for the M-Pesa prompt and enter your PIN to complete Order <strong>#{{ order.id }}</strong>.
        </p>

        <div class="status-box" id="statusBox">
            <i class="fa-solid fa-"></i>
            <span id="statusText">Awaiting PIN authorization...</span>
        </div>

        <div class="actions">
            <button id="retryBtn" class="btn btn-status" disabled>
                <i class="fa-solid fa-sync fa-spin"></i> Checking Payment Status...
            </button>
            
            <a href="{% url 'cart:view' %}" class="btn btn-cart">
                <i class="fa-solid fa-cart-shopping"></i> Return to Cart
            </a>
        </div>
    </div>

    <script>
        function checkPaymentStatus() {
            fetch("{% url 'orders:check_payment_status' order.id %}") 
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success" || data.status === "Paid") {
                        window.location.href = "{% url 'orders:payment_success' order.id %}"; 
                    } else if (data.status === "failed" || data.status === "Cancelled") {
                        window.location.href = "{% url 'orders:payment_failed' %}";
                    } else {
                        document.getElementById("statusText").innerText = "Awaiting PIN authorization...";
                        setTimeout(checkPaymentStatus, 4000);
                    }
                })
                .catch(error => {
                    console.error("Error checking payment status:", error);
                    document.getElementById("statusText").innerText = "Connection retry in progress...";
                    setTimeout(checkPaymentStatus, 5000);
                });
        }
    
        // Initial call after 3 seconds
        setTimeout(checkPaymentStatus, 3000);
    </script>
</body>
</html>
