<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Order #{{ order.id }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .pin-card {
            max-width: 480px;
            margin: 80px auto;
        }
        .pin-input {
            letter-spacing: 0.5rem;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card border-0 shadow-sm p-4 rounded-4 bg-white pin-card">
        <div class="text-center mb-4">
            <div class="mb-3">
                <i class="fa-solid fa-shield-halved text-primary fa-3x"></i>
            </div>
            <h4 class="fw-bold">Verify Order #{{ order.id }}</h4>
            <p class="text-muted small">
                Enter the 6-digit verification PIN sent to <strong>{{ order.email }}</strong> to view order details and delivery status.
            </p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show small" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- PIN Verification Form -->
        <form method="POST" action="{% url 'orders:verify_order_pin' order.id %}" class="mb-3">
            {% csrf_token %}
            <input type="hidden" name="action" value="verify_pin">
            <div class="mb-3">
                <label for="pinInput" class="form-label fw-semibold text-secondary small">6-Digit Verification PIN</label>
                <input type="text" 
                       name="pin" 
                       id="pinInput" 
                       class="form-control form-control-lg text-center fw-bold pin-input" 
                       placeholder="123456" 
                       maxlength="6" 
                       required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                Verify & View Order
            </button>
        </form>

        <hr class="my-3 text-muted">

        <!-- Resend PIN / Email Trigger -->
        <form method="POST" action="{% url 'orders:verify_order_pin' order.id %}">
            {% csrf_token %}
            <input type="hidden" name="action" value="send_pin">
            <div class="d-grid">
                <button type="submit" class="btn btn-outline-secondary btn-sm fw-medium">
                    <i class="fa-solid fa-paper-plane me-1"></i> Send PIN to Email
                </button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'login' %}?next={% url 'orders:order_receipt' order.id %}" class="small text-decoration-none">
                Already have an account? Log in here
            </a>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
